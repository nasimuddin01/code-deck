# Linux / Raspberry Pi. Not for macOS: Docker Desktop cannot pass USB devices
# through, and the Codex app-server is a macOS binary — use `pipx` + launchd there.
#
#   cp .env.example .env                 # optional; defaults work as-is
#   docker compose --env-file .env -f docker/compose.yml up -d --build
#   open http://localhost:8765           # builder
#
# Settings come from the repo's .env (CODE_DECK_* keys). The host-side ports
# follow CODE_DECK_PORT / CODE_DECK_OTLP_PORT; inside the container the server
# always listens on 8765/4318 and the paths below are fixed, so those keys are
# overridden in `environment:`.
#
# Claude Code on the host must point telemetry at the published OTLP port (see
# `code-deck env print`) and run the attention hook; the hook writes flags into
# ~/.claude/code-deck, which is mounted read-write below.
services:
  code-deck:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: code-deck:local
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb           # TURZX 1a86:5722
    ports:
      - "127.0.0.1:${CODE_DECK_PORT:-8765}:8765"        # builder / API / player
      - "127.0.0.1:${CODE_DECK_OTLP_PORT:-4318}:4318"   # OTLP receiver for Claude Code cost
    volumes:
      - ${CODE_DECK_CLAUDE_DIR:-${HOME}/.claude}/projects:/root/.claude/projects:ro
      - ${CODE_DECK_CLAUDE_DIR:-${HOME}/.claude}/code-deck:/root/.claude/code-deck   # attention flags + otel day state (rw)
      - ${CODE_DECK_CODEX_DIR:-${HOME}/.codex}:/root/.codex:ro
      - code-deck-data:/data                # layout.json, caches, preview.png
    shm_size: 512m                          # headless Chromium
    env_file:
      - path: ../.env
        required: false
    environment:                            # container-internal, wins over .env
      CODE_DECK_HOME: /data
      CODE_DECK_HOST: 0.0.0.0
      CODE_DECK_PORT: "8765"
      CODE_DECK_OTLP_HOST: 0.0.0.0
      CODE_DECK_OTLP_PORT: "4318"
      CODE_DECK_CLAUDE_DIR: /root/.claude
      CODE_DECK_CODEX_DIR: /root/.codex

volumes:
  code-deck-data:
