# Publish the wheel to PyPI on a version tag (v2.0.0). Uses PyPI trusted
# publishing: register this repo + workflow as a publisher for the project
# on pypi.org first — no API token is stored anywhere.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile && pnpm build:server
      - uses: astral-sh/setup-uv@v5
      - run: cd server && uv build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: server/dist/* }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write, contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
