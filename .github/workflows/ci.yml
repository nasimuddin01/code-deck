name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist, retention-days: 7 }

  server:
    needs: web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: server/src/code_deck/static }
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run python -m playwright install --with-deps chromium
      # a real frame through the Chromium pipeline, no device, dummy data
      - run: uv run code-deck render golden.png --mock
      - name: frame sanity (size + not blank)
        run: |
          uv run python - <<'PY'
          from PIL import Image, ImageStat
          im = Image.open("golden.png").convert("RGB")
          assert im.size == (320, 480), im.size
          assert max(ImageStat.Stat(im).stddev) > 10, "frame is blank"
          print("ok", im.size)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: golden-frame, path: server/golden.png, retention-days: 7 }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with: { name: wheel, path: server/dist/*.whl, retention-days: 14 }

  docker:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: code-deck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
