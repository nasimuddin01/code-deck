[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "code-deck"
version = "2.0.0"
description = "Desk dashboard for Claude Code + Codex on a TURZX 3.5\" USB screen"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ehfaz Rezwan" }]
keywords = ["claude-code", "codex", "dashboard", "usb", "turzx"]
dependencies = [
  "typer>=0.27,<1",
  "pyusb>=1.3.1,<2",
  "pillow>=12,<13",
  "numpy>=2,<3",
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.10,<3",
  "psutil>=6,<8",
  "playwright>=1.55,<2",
]

[project.scripts]
code-deck = "code_deck.cli:app"
code-deck-hook = "code_deck.hooks.attention:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13", "httpx>=0.27"]

[tool.hatch.build]
# the built web app is gitignored; declare it an artifact so BOTH the sdist and
# the wheel carry it (uv builds the wheel from the sdist, so excluding it from
# the sdist silently drops it from the wheel too)
artifacts = ["src/code_deck/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/code_deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# explicit so CI lints the same set regardless of a developer's global ruff config
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",   # typer.Option/Argument in defaults is the typer idiom
  "E501",   # long strings in CLI help/log lines; formatter handles code
  "SIM105", # explicit try/except/pass reads better than contextlib.suppress here
  "RUF012", # mutable class attrs are fine for the small dataclass-free stores
]
